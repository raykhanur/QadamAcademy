<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Qadam Academy — ҰБТ-ға дайындық платформасы.">
  <title>Qadam Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

  <!-- ── Data ───────────────────────────────────────────────────── -->
  <script src="data/subjects.js"></script>

  <!-- ── Core modules ──────────────────────────────────────────── -->
  <script src="js/storage.js?v=2"></script>
  <script src="js/router.js"></script>
  <script src="js/ui.js?v=2"></script>

  <!-- ── Page modules ──────────────────────────────────────────── -->
  <script src="js/pages/auth.js?v=2"></script>
  <script src="js/pages/home.js?v=2"></script>
  <script src="js/pages/subjects.js?v=2"></script>
  <script src="js/pages/lesson.js"></script>
  <script src="js/pages/test.js"></script>
  <script src="js/pages/dashboard.js?v=4"></script>

  <!-- ── App bootstrap ─────────────────────────────────────────── -->
  <script>
    (function () {
      const user = Storage.getUser();

      if (!user) {
        // No account — show onboarding
        renderAuth(function(newUser) {
          bootApp(newUser);
        });
        // Also handle existing-account clicks that may be in the DOM
        document.addEventListener('click', function(e) {
          const btn = e.target.closest('.existing-btn');
          if (!btn) return;
          Storage.switchUser(btn.dataset.uid);
          bootApp(Storage.getUser());
        });
        return;
      }

      bootApp(user);
    })();

    function bootApp(user) {
      UI.renderShell(user);

      Router.register('home',            () => renderHome());
      Router.register('subjects',        () => renderSubjects());
      Router.register('subject',         (id) => renderSubject(id));
      Router.register('lesson',          (sId, lId) => renderLesson(sId, lId));
      Router.register('test',            (sId, tId) => renderTest(sId, tId));
      Router.register('dashboard',       () => renderDashboard());
      Router.register('subject-settings',() => renderSubjectSettings());

      Router.register('404', () => {
        UI.setTitle('Бет табылмады');
        UI.setContent(`
          <div style="text-align:center;padding:4rem 2rem">
            <div style="font-size:4rem;margin-bottom:1rem">🔍</div>
            <h1 style="font-size:2rem;color:var(--gray-800);margin-bottom:.75rem">Бет табылмады</h1>
            <p style="color:var(--gray-500);margin-bottom:2rem">Сұралған бет жоқ немесе жойылған.</p>
            <a href="#home" class="btn btn-primary">Басты бетке оралу</a>
          </div>
        `);
      });

      if (!window.location.hash || window.location.hash === '#') {
        window.location.hash = '#home';
      }
      Router.init();
    }
  </script>

</body>
</html>
